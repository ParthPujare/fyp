# Casbin RBAC model — "RBAC with domains" (ref_docs/plan.md §3, proposed_architecture.md §5).
# Deny-by-default: an (sub, dom, obj, act) tuple with no matching allow row is denied.
#
# r = subject(user email), dom = caller's department (from JWT `dept`), obj = target
#     resource namespace (e.g. "crm"), act = action (e.g. "read", "create", "delete").
# p = policy rows keyed by role; g = user -> role assignment within a domain.

[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, dom, obj, act

[role_definition]
g = _, _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub, r.dom) && r.dom == p.dom && keyMatch2(r.obj, p.obj) && (r.act == p.act || p.act == "*")
