[project]
name = "fyp-agent-harness"
version = "0.1.0"
description = "Zero-trust security gateway & harness middleware for an Enterprise AI Personal Assistant."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "PyJWT>=2.10",
    "httpx>=0.27",
    "litellm>=1.52",
    "langgraph>=1.2.10",
    "langchain-core>=1.5.3",
    "casbin>=1.43.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pyyaml>=6.0.3",
    "cryptography>=42.0",
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "google-genai>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
